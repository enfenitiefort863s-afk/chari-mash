<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予想ログ</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e14;
    --bg-elev: #10151d;
    --card: #151b26;
    --card-border: #232b3a;
    --line: #1e2532;
    --lime: #cbe000;
    --lime-dim: #8f9c00;
    --orange: #ff7a1a;
    --text: #eef1f5;
    --text-sub: #8b96a8;
    --text-faint: #5c6779;
    --danger: #ff5b5b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg-elev) 85%, transparent);
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  header .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  header .mark {
    display: inline-block;
    width: 8px; height: 18px;
    background: var(--lime);
    border-radius: 2px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header .sub {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  #gate {
    max-width: 340px;
    margin: 90px auto 0;
    text-align: center;
    padding: 0 20px;
  }
  #gate .lock {
    font-size: 30px;
    margin-bottom: 6px;
  }
  #gate h2 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px;
    color: var(--text-sub);
  }
  #gate input {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    box-sizing: border-box;
  }
  #gate input:focus {
    outline: none;
    border-color: var(--lime-dim);
  }
  #gate button {
    margin-top: 10px;
    width: 100%;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 10px;
    border: none;
    background: var(--lime);
    color: #14180a;
  }
  #gate button:active { opacity: 0.85; }
  #err { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }

  #content { display: none; max-width: 640px; margin: 0 auto; padding: 14px 14px 40px; }
  #updated {
    color: var(--text-faint);
    font-size: 11px;
    text-align: right;
    margin: 4px 4px 12px;
  }

  .entry {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 0;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .entry-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--line);
  }
  .entry-time {
    font-size: 11px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .badge.予想配信 { background: rgba(203,224,0,0.16); color: var(--lime); }
  .badge.的中速報 { background: rgba(255,122,26,0.16); color: var(--orange); }
  .badge.結果報告 { background: rgba(139,150,168,0.16); color: var(--text-sub); }
  .badge.default  { background: rgba(139,150,168,0.16); color: var(--text-sub); }

  .entry-body {
    padding: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13.5px;
    line-height: 1.75;
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark"></span><h1>マッシュチャリンコ</h1></div>
    <div class="sub">予想・的中・結果ログ</div>
  </header>

  <div id="gate">
    <div class="lock">🔒</div>
    <h2>パスワードを入力してください</h2>
    <input id="pw" type="password" placeholder="パスワード" autofocus>
    <button id="btn">開く</button>
    <div id="err"></div>
  </div>

  <div id="content">
    <div id="updated"></div>
    <div id="list"></div>
  </div>

<script>
function toBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function unlock() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  if (!pw) return;
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    const payload = await res.json();
    const salt = toBytes(payload.salt);
    const iv = toBytes(payload.iv);
    const data = toBytes(payload.data);
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(pw), { name: 'PBKDF2' }, false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
    const entries = JSON.parse(new TextDecoder().decode(plainBuf));
    render(entries, payload.updated);
    try { sessionStorage.setItem('pw', pw); } catch (e) {}
  } catch (e) {
    err.textContent = 'パスワードが違うか、データを読み込めませんでした';
  }
}

function render(entries, updated) {
  document.getElementById('updated').textContent = '最終更新 ' + updated;
  const list = document.getElementById('list');
  list.innerHTML = '';
  entries.slice().reverse().forEach(e => {
    const div = document.createElement('div');
    div.className = 'entry';

    const head = document.createElement('div');
    head.className = 'entry-head';
    const time = document.createElement('span');
    time.className = 'entry-time';
    time.textContent = e.time;
    head.appendChild(time);
    if (e.label) {
      const badge = document.createElement('span');
      badge.className = 'badge ' + (['予想配信','的中速報','結果報告'].includes(e.label) ? e.label : 'default');
      badge.textContent = e.label;
      head.appendChild(badge);
    }
    div.appendChild(head);

    const body = document.createElement('div');
    body.className = 'entry-body';
    body.textContent = e.text;
    div.appendChild(body);

    list.appendChild(div);
  });
  document.getElementById('gate').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

document.getElementById('btn').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', ev => { if (ev.key === 'Enter') unlock(); });

(function () {
  try {
    const saved = sessionStorage.getItem('pw');
    if (saved) { document.getElementById('pw').value = saved; unlock(); }
  } catch (e) {}
})();
</script>
</body>
</html>
