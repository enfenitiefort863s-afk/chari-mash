name: keirin-line

on:
  schedule:
    # GitHubのcronはUTC。日本時間 8:00(通常開催)/ 20:00(ミッドナイト)
    - cron: "0 23 * * *"   # 8:00 JST -> 通常開催(ナイターまで)
    - cron: "0 11 * * *"   # 20:00 JST -> ミッドナイトのみ
  workflow_dispatch:       # 外部タイマー(cron-job.org)や手動実行ボタンから呼ぶ用
    inputs:
      session:
        description: "day(通常開催) / midnight(ミッドナイト) / all(両方)"
        default: "all"

permissions:
  contents: write         # 配信した買い目(data/)をリポジトリに保存するため

concurrency:
  group: keirin-line      # 同時に2つ動かさず順番に実行する(二重配信ガードが前の実行の記録を見られるように)
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python keirin_run.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          WORKERS: ${{ vars.WORKERS }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          VENUES: ${{ vars.VENUES }}
          N_PICKS: ${{ vars.N_PICKS }}
          ENRICH_BUDGET: "600"
          SESSION: ${{ (github.event.schedule == '0 23 * * *' && 'day') || (github.event.schedule == '0 11 * * *' && 'midnight') || github.event.inputs.session || 'all' }}
      - name: Save data
        if: always()
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "update picks"
            git pull --rebase
            git push
          fi
