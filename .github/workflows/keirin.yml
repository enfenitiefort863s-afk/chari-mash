name: keirin-line

on:
  schedule:
    # GitHubのcronはUTC。日本時間 8:00(通常開催)/ 20:00(ミッドナイト)
    - cron: "0 23 * * *"   # 8:00 JST -> 通常開催(ナイターまで)
    - cron: "0 11 * * *"   # 20:00 JST -> ミッドナイトのみ
  workflow_dispatch: {}   # 手動実行ボタン用

permissions:
  contents: write         # 配信した買い目(data/)をリポジトリに保存するため

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python keirin_run.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          WORKERS: ${{ vars.WORKERS }}
          VENUES: ${{ vars.VENUES }}
          SPLIT_MODE: ${{ vars.SPLIT_MODE }}
          PER_VENUE: ${{ vars.PER_VENUE }}
          MAX_MESSAGES: ${{ vars.MAX_MESSAGES }}
          ENRICH_BUDGET: "600"
          SESSION: ${{ (github.event.schedule == '0 23 * * *' && 'day') || (github.event.schedule == '0 11 * * *' && 'midnight') || 'all' }}
      - name: Save data
        if: always()
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "update picks"
            git pull --rebase
            git push
          fi
