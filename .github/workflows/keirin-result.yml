name: keirin-result

on:
  schedule:
    # 日本時間 23:40(その日の結果)と 7:20(深夜レースの取りこぼし)
    - cron: "40 14 * * *"
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "night(23:40の分) / morning(7:20の分) / 空欄(手動)"
        default: ""

permissions:
  contents: write

concurrency:
  group: keirin-result
  cancel-in-progress: false

jobs:
  result:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python keirin_result.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          WORKERS: ${{ vars.WORKERS }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          SLOT: ${{ (github.event.schedule == '40 14 * * *' && 'night') || (github.event.schedule == '20 22 * * *' && 'morning') || github.event.inputs.slot || '' }}
      - name: Save data
        if: always()
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "update results"
            git pull --rebase
            git push
          fi
