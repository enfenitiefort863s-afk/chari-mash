name: keirin-alert

on:
  schedule:
    # 10分おき(JST 9:00〜24:59ごろ=UTC 0:00〜15:59)。的中したときだけLINEに送る
    - cron: "*/10 0-15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: keirin-alert
  cancel-in-progress: true   # 待ち行列を作らず、常に最新のチェックを優先する(これが無いと、何かの理由で
                              # 1回の実行が長引いたときに待ち行列が積み重なり、他の配信まで巻き込んで遅れる)

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python keirin_alert.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY: discord
          WORKERS: ${{ vars.WORKERS }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
      - name: Save data
        if: always()
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "update results (alert)"
            pushed=0
            for i in 1 2 3 4 5; do
              git pull --rebase
              if git push; then pushed=1; break; fi
              echo "push failed, retrying ($i/5)"
              sleep $((i * 10))
            done
            if [ "$pushed" != "1" ]; then echo "push failed after 5 attempts"; exit 1; fi
          fi
